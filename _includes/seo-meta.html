<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="generator" content="Jekyll v{{ jekyll.version }}" />
<meta property="og:title" content="{{ page.title | default: site.title }}" />
<meta name="author" content="{{ site.author.name }}" />
<meta property="og:locale" content="es" />
<meta name="description" content="{{ page.description | default: site.description }}" />
<meta property="og:description" content="{{ page.description | default: site.description }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:image" content="{{ site.url }}/assets/images/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
{% if page.date %}
  <meta property="og:type" content="article" />
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  {% if page.last_modified_at %}
  <meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}" />
  {% endif %}
{% else %}
  <meta property="og:type" content="website" />
{% endif %}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ site.url }}/assets/images/og-image.png" />
<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
<meta name="twitter:site" content="@{{ site.twitter_username }}" />
<meta name="twitter:creator" content="@{{ site.twitter_username }}" />
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ 'feed.xml' | absolute_url }}" />
